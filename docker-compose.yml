# ── BatteryBench — Docker Compose ─────────────────────────────
# Services:
#   mysql    : MySQL 8.0 database
#   trainer  : TensorFlow 2.10 + GPU — CNN/LSTM/Transformer
#   dashboard: Flask web dashboard
#
# Usage:
#   docker compose up -d mysql          ← start database only
#   docker compose run --rm trainer     ← run training
#   docker compose up dashboard         ← start dashboard
#   docker compose up                   ← start everything

services:

  # ── MySQL Database ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: batterybench_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: batterybench
      MYSQL_USER: battuser
      MYSQL_PASSWORD: battery123
    ports:
      - "3307:3306"         # 3307 on host to avoid conflict with BearingBench
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d   # auto-runs schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "battuser", "-pbattery123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batterybench

  # ── Trainer ────────────────────────────────────────────────
  trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    container_name: batterybench_trainer
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=battuser
      - DB_PASSWORD=battery123
      - DB_NAME=batterybench
      - CUDA_VISIBLE_DEVICES=0
      - TF_CPP_MIN_LOG_LEVEL=3
    volumes:
      - ./trainer/src:/app/src           # source code
      - ./data:/app/data                 # cache folder
      - /mnt/d/DEEP-LEARNING/ADVANCED_DEEP_LEARNING/PROJECTS/BATTERY/XJTU/dataset/Batch-1:/app/data/Batch-1
      - /mnt/d/DEEP-LEARNING/ADVANCED_DEEP_LEARNING/PROJECTS/BATTERY/XJTU/dataset/Batch-2:/app/data/Batch-2
      - /mnt/d/DEEP-LEARNING/ADVANCED_DEEP_LEARNING/PROJECTS/BATTERY/XJTU/dataset/Batch-3:/app/data/Batch-3
      - /mnt/d/DEEP-LEARNING/ADVANCED_DEEP_LEARNING/PROJECTS/BATTERY/XJTU/dataset/Batch-4:/app/data/Batch-4
      - /mnt/d/DEEP-LEARNING/ADVANCED_DEEP_LEARNING/PROJECTS/BATTERY/XJTU/dataset/Batch-5:/app/data/Batch-5
      - ./models:/app/models             # saved models
      - ./results:/app/results           # plots + reports
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - batterybench
    command: python src/battery_trainer.py

  # ── Dashboard ──────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: batterybench_dashboard
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=battuser
      - DB_PASSWORD=battery123
      - DB_NAME=batterybench
    ports:
      - "5001:5000"         # http://localhost:5001
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/templates:/app/templates
      - ./dashboard/static:/app/static
      - ./models:/app/models             # read-only access to models
      - ./results:/app/results           # read-only access to plots
    networks:
      - batterybench
    command: python src/app.py

volumes:
  mysql_data:

networks:
  batterybench:
    driver: bridge
